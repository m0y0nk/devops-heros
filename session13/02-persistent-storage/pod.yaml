apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: persistent-storage
        # changed the folder path from /data to /pv-demo
          mountPath: /pv-demo
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: student-pvc
